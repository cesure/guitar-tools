<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar Tools</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Staatliches&family=Inter:wght@300&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            background-image: radial-gradient(circle at center, #2b241e 0%, #0f0f0f 100%);
            color: #d1b894;
            overflow-x: hidden;
            user-select: none;
        }

        /* --- Navigation Menu --- */
        nav {
            display: flex;
            gap: 40px;
            padding: 30px;
            z-index: 10;
        }

        nav a {
            font-family: 'Staatliches', cursive;
            color: #d1b894;
            text-decoration: none;
            letter-spacing: 3px;
            font-size: 1.1rem;
            opacity: 0.4;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        nav a:hover, nav a.active {
            opacity: 1;
        }

        /* --- Tool Sections --- */
        .content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        section {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        section.active {
            display: flex;
        }

        /* --- Trainer Styles --- */
        #chord-display {
            font-family: 'Staatliches', cursive;
            font-size: clamp(8rem, 35vw, 18rem);
            color: #eee2d1;
            height: clamp(160px, 40vw, 350px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.5);
            transition: transform 0.08s ease-out, opacity 0.1s ease-out;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        button {
            padding: 12px 30px;
            font-size: 1rem;
            cursor: pointer;
            background: transparent;
            color: #d1b894;
            border: 1px solid #d1b894;
            font-family: 'Staatliches', cursive;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #d1b894;
            color: #1a1a1a;
            box-shadow: 0 0 30px rgba(209, 184, 148, 0.2);
        }

        button:active {
            transform: translateY(2px) scale(0.98);
        }

        #repeatBtn {
            border-style: dashed;
            opacity: 0.7;
        }

        #repeatBtn:hover {
            border-style: solid;
            opacity: 1;
        }

        button.active-root {
            background: #d1b894;
            color: #1a1a1a;
        }

        /* --- Fretboard Styles --- */
        .fretboard {
            display: flex;
            flex-direction: column;
            background: #222;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            margin-top: 20px;
        }

        .string {
            display: flex;
            height: 30px;
            align-items: center;
            position: relative;
        }

        /* String wire effect */
        .string::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: #444;
            z-index: 1;
        }

        .fret {
            box-sizing: border-box;
            width: 60px;
            height: 100%;
            border-right: 2px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .fret-0 { border-right: 6px solid #888; width: 40px; } /* Nut */

        .note-marker {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
            color: transparent;
        }

        .note-marker.active {
            background: #eee2d1;
            color: #1a1a1a;
        }

        .note-marker.root {
            background: #d1b894;
            color: #1a1a1a;
            box-shadow: 0 0 10px #d1b894;
        }

        .fret-labels {
            display: flex;
            margin-top: 10px;
        }

        .fret-label {
            box-sizing: border-box;
            width: 60px;
            text-align: center;
            font-size: 0.8rem;
            color: #555;
            position: relative;
        }

        .fret-label.fret-0 { width: 40px; border: none; }

        /* Inlay markers (3, 5, 7, 9, 12) */
        .fret-label.inlay { color: #d1b894; }
        .fret-label.inlay::before {
            content: '•';
            display: block;
            font-size: 1rem;
            line-height: 0.8;
        }
        .fret-label.inlay-double::before { content: '••'; letter-spacing: 2px; }

        .fretboard-scroll {
            max-width: 100%;
            overflow-x: auto;
            padding: 0 16px 20px;
            box-sizing: border-box;
        }

        .fretboard-wrap {
            width: max-content;
            margin: 0 auto;
        }

        #root-selector {
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding: 0 16px;
        }

        #root-selector button {
            padding: 8px 0;
            width: 52px;
        }

        .instructions {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #665c52;
            letter-spacing: 3px;
            font-weight: 300;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <nav>
        <a onclick="showTool('trainer')" class="active" id="nav-trainer">Trainer</a>
        <a onclick="showTool('pentatonic')" id="nav-pentatonic">Pentatonic Map</a>
    </nav>

    <div class="content">
        <section id="trainer" class="active">
            <div id="chord-display">?</div>
            <div class="controls">
                <button onclick="generateNote()">Next Note</button>
                <button id="repeatBtn" onclick="repeatTone()">Repeat</button>
            </div>
            <div class="instructions">SPACEBAR: NEXT // 'R': REPEAT</div>
        </section>

        <section id="pentatonic">
            <h2 style="font-family: 'Staatliches'; letter-spacing: 4px;">Minor Pentatonic</h2>

            <div class="controls" id="root-selector">
                </div>

            <div class="fretboard-scroll">
                <div class="fretboard-wrap">
                    <div class="fretboard">
                        <div id="fretboard-element"></div>
                        <div class="fret-labels" id="fret-labels-element"></div>
                    </div>
                </div>
            </div>

            <div class="instructions">ROOT NOTES ARE HIGHLIGHTED GOLD</div>
        </section>
    </div>

    <script>
        /* --- APP STATE & DATA --- */
        const noteFreqs = { 'C': 130.81, 'D': 146.83, 'E': 164.81, 'F': 174.61, 'G': 196.00, 'A': 220.00, 'B': 246.94 };
        const allNotes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const stringRoots = [4, 11, 7, 2, 9, 4]; // E B G D A E (indices in allNotes)

        let audioCtx = null;
        let lastNote = '';
        let currentPentatonicRoot = 'A';

        /* --- NAVIGATION --- */
        function showTool(toolId) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
            document.getElementById(toolId).classList.add('active');
            document.getElementById('nav-' + toolId).classList.add('active');
            if(toolId === 'pentatonic') renderFretboard();
        }

        /* --- TRAINER LOGIC --- */
        function generateNote() {
            initAudio();
            let newNote;
            const names = Object.keys(noteFreqs);
            do { newNote = names[Math.floor(Math.random() * names.length)]; } while (newNote === lastNote);
            const display = document.getElementById('chord-display');
            display.innerText = newNote;
            lastNote = newNote;
            display.style.transform = 'scale(1.05)';
            setTimeout(() => display.style.transform = 'scale(1)', 80);
            playEnhancedTone(noteFreqs[newNote]);
        }

        function repeatTone() {
            if (!lastNote) return;
            initAudio();
            const display = document.getElementById('chord-display');
            display.style.opacity = '0.7';
            setTimeout(() => display.style.opacity = '1', 100);
            playEnhancedTone(noteFreqs[lastNote]);
        }

        /* --- PENTATONIC LOGIC --- */
        function getPentatonicNotes(root) {
            let rootIdx = allNotes.indexOf(root);
            // Minor Pentatonic Intervals: 0, 3, 5, 7, 10 (semitones)
            return [0, 3, 5, 7, 10].map(interval => allNotes[(rootIdx + interval) % 12]);
        }

        function renderFretboard() {
            const rootContainer = document.getElementById('root-selector');
            const board = document.getElementById('fretboard-element');
            const labels = document.getElementById('fret-labels-element');

            // 1. Render Root Buttons
            rootContainer.innerHTML = '';
            allNotes.forEach(note => {
                const btn = document.createElement('button');
                btn.innerText = note;
                if(note === currentPentatonicRoot) btn.className = 'active-root';
                btn.onclick = () => { currentPentatonicRoot = note; renderFretboard(); };
                rootContainer.appendChild(btn);
            });

            // 2. Render Strings/Frets
            board.innerHTML = '';
            const scaleNotes = getPentatonicNotes(currentPentatonicRoot);

            stringRoots.forEach(stringRootIdx => {
                const stringDiv = document.createElement('div');
                stringDiv.className = 'string';

                for(let f = 0; f <= 14; f++) {
                    const fretDiv = document.createElement('div');
                    fretDiv.className = `fret fret-${f}`;

                    const noteAtFret = allNotes[(stringRootIdx + f) % 12];
                    const marker = document.createElement('div');
                    marker.className = 'note-marker';
                    marker.innerText = noteAtFret;

                    if(scaleNotes.includes(noteAtFret)) {
                        marker.classList.add('active');
                        if(noteAtFret === currentPentatonicRoot) marker.classList.add('root');
                    }

                    fretDiv.appendChild(marker);
                    stringDiv.appendChild(fretDiv);
                }
                board.appendChild(stringDiv);
            });

            // 3. Render Labels (same box widths as frets, inlay dots on 3/5/7/9/12)
            labels.innerHTML = '';
            for(let i=0; i<=14; i++) {
                const l = document.createElement('div');
                l.className = `fret-label fret-${i}`;
                if(i > 0) l.innerText = i;
                if([3, 5, 7, 9].includes(i)) l.classList.add('inlay');
                if(i === 12) l.classList.add('inlay', 'inlay-double');
                labels.appendChild(l);
            }
        }

        /* --- AUDIO ENGINE --- */
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playEnhancedTone(freq) {
            const now = audioCtx.currentTime;
            const duration = 3.5;
            const masterGain = audioCtx.createGain();
            masterGain.connect(audioCtx.destination);
            masterGain.gain.setValueAtTime(0, now);
            masterGain.gain.linearRampToValueAtTime(0.6, now + 0.01);
            masterGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

            [1, 2, 3, 4, 5].forEach((h, i) => {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = (i === 0) ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(freq * h, now);
                g.gain.setValueAtTime([0.5, 0.25, 0.12, 0.06, 0.03][i], now);
                osc.connect(g); g.connect(masterGain);
                osc.start(now); osc.stop(now + duration);
            });
        }

        window.addEventListener('keydown', (e) => {
            if(!document.getElementById('trainer').classList.contains('active')) return;
            if(e.metaKey || e.ctrlKey || e.altKey) return; // keep Cmd+R etc. untouched
            if(e.code === "Space") { e.preventDefault(); generateNote(); }
            if(e.key.toLowerCase() === "r") { repeatTone(); }
        });
    </script>
</body>
</html>
