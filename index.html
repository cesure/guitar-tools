<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Location Trainer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Staatliches&family=Inter:wght@300&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            background-image: radial-gradient(circle at center, #2b241e 0%, #0f0f0f 100%);
            color: #d1b894;
            overflow: hidden;
            user-select: none;
        }

        /* --- Navigation Menu --- */
        nav {
            display: flex;
            gap: 40px;
            padding: 30px;
            z-index: 10;
        }

        nav a {
            font-family: 'Staatliches', cursive;
            color: #d1b894;
            text-decoration: none;
            letter-spacing: 3px;
            font-size: 1.1rem;
            opacity: 0.4;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        nav a:hover, nav a.active {
            opacity: 1;
        }

        /* --- Tool Sections --- */
        .content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        section {
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        section.active {
            display: flex;
        }

        #chord-display {
            font-family: 'Staatliches', cursive;
            font-size: 18rem;
            color: #eee2d1;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.5);
            transition: transform 0.08s ease-out;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        button {
            padding: 16px 45px;
            font-size: 1.2rem;
            cursor: pointer;
            background: transparent;
            color: #d1b894;
            border: 1px solid #d1b894;
            font-family: 'Staatliches', cursive;
            text-transform: uppercase;
            letter-spacing: 4px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #d1b894;
            color: #1a1a1a;
            box-shadow: 0 0 30px rgba(209, 184, 148, 0.2);
        }

        button:active {
            transform: translateY(2px) scale(0.98);
        }

        #repeatBtn {
            padding: 16px 25px;
            opacity: 0.7;
            border-style: dashed;
        }

        #repeatBtn:hover {
            opacity: 1;
            border-style: solid;
        }

        .instructions {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #665c52;
            letter-spacing: 3px;
            font-weight: 300;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <nav>
        <a onclick="showTool('trainer')" class="active" id="nav-trainer">Note Location Trainer</a>
        <!--
        <a onclick="showTool('metronome')" id="nav-metronome">Metronome</a>
        <a onclick="showTool('settings')" id="nav-settings">Settings</a>
        -->
    </nav>

    <div class="content">
        <section id="trainer" class="active">
            <div id="chord-display">?</div>

            <div class="controls">
                <button id="nextBtn" onclick="generateNote()">Next Note</button>
                <button id="repeatBtn" onclick="repeatTone()">Repeat Tone</button>
            </div>

            <div class="instructions">
                SPACEBAR: NEXT NOTE <br>
                'R' KEY: REPEAT TONE
            </div>
        </section>

        <section id="metronome">
            <div id="chord-display" style="font-size: 8rem;">Coming Soon</div>
        </section>

        <section id="settings">
            <div id="chord-display" style="font-size: 8rem;">Settings</div>
        </section>
    </div>

    <script>
        const notes = {
            'C': 130.81, 'D': 146.83, 'E': 164.81,
            'F': 174.61, 'G': 196.00, 'A': 220.00, 'B': 246.94
        };

        const noteNames = Object.keys(notes);
        let audioCtx = null;
        let lastNote = '';

        // Navigation Function
        function showTool(toolId) {
            // Remove active classes
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));

            // Add active classes
            document.getElementById(toolId).classList.add('active');
            document.getElementById('nav-' + toolId).classList.add('active');
        }

        window.addEventListener('keydown', (e) => {
            // Only allow shortcuts if trainer is visible
            if(!document.getElementById('trainer').classList.contains('active')) return;

            if(e.code === "Space") {
                e.preventDefault();
                generateNote();
            }
            if(e.key.toLowerCase() === "r") {
                repeatTone();
            }
        });

        function generateNote() {
            initAudio();
            let newNote;
            do {
                newNote = noteNames[Math.floor(Math.random() * noteNames.length)];
            } while (newNote === lastNote);

            const display = document.getElementById('chord-display');
            display.innerText = newNote;
            lastNote = newNote;

            display.style.transform = "scale(1.05)";
            setTimeout(() => display.style.transform = "scale(1)", 80);

            playEnhancedTone(notes[newNote]);
        }

        function repeatTone() {
            if (lastNote && notes[lastNote]) {
                initAudio();
                playEnhancedTone(notes[lastNote]);

                const display = document.getElementById('chord-display');
                display.style.opacity = "0.7";
                setTimeout(() => display.style.opacity = "1", 100);
            }
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playEnhancedTone(freq) {
            const now = audioCtx.currentTime;
            const duration = 3.5;
            const masterGain = audioCtx.createGain();
            masterGain.connect(audioCtx.destination);

            masterGain.gain.setValueAtTime(0, now);
            masterGain.gain.linearRampToValueAtTime(0.6, now + 0.01);
            masterGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

            const harmonics = [1, 2, 3, 4, 5];
            const volumes = [0.5, 0.25, 0.12, 0.06, 0.03];

            harmonics.forEach((h, i) => {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = (i === 0) ? 'triangle' : 'sine';
                osc.frequency.setValueAtTime(freq * h, now);
                g.gain.setValueAtTime(volumes[i], now);
                osc.connect(g);
                g.connect(masterGain);
                osc.start(now);
                osc.stop(now + duration);
            });
        }
    </script>
</body>
</html>
